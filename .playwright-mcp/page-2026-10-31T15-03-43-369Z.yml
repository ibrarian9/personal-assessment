              - textbox "Catatan Bimbingan atau Rekomendasi Tindak Lanjut Guru:" [ref=f28e835]:
                - /placeholder: Tuliskan arahan bimbingan akademik, penugasan remedial per TP, atau materi pengayaan...
                - text: "Rekomendasi Guru (AI): Aafif menunjukkan performa yang sangat baik dengan rata-rata nilai 91.6. Ia telah menguasai dengan sangat baik topik-topik seperti Sistem Gerak dan Syaraf Manusia serta Sistem Reproduksi dan Pubertas, yang tercermin dari nilai tinggi di sebagian besar TP. Namun, ada beberapa TP yang menunjukkan nilai di bawah 90, seperti TP 2.4, di mana Aafif memperoleh nilai 87, yang menunjukkan bahwa ada ruang untuk penguatan lebih lanjut dalam memahami cara merancang materi edukasi yang efektif. Untuk TP 2.4, yang berfokus pada penerimaan diri selama pubertas, Aafif perlu lebih mendalami aspek desain dan penyampaian informasi. Strategi pengajaran yang dapat diterapkan adalah menggunakan media visual seperti komik atau video untuk membantu Aafif lebih memahami cara menyampaikan informasi dengan cara yang menarik dan informatif. Selain itu, untuk TP lainnya dengan nilai di atas 90, guru dapat memberikan tantangan pengayaan seperti proyek kreatif atau penelitian tambahan yang sesuai dengan gaya belajar visualnya."
              - paragraph [ref=f28e836]:
                - generic [ref=f28e839]:
                  - text: Catatan ini otomatis terisi dari rekomendasi AI. Jika Anda mengubahnya dan klik
                  - strong [ref=f28e840]: Simpan Catatan Guru
                  - text: ", perubahan akan langsung diperbarui pada kartu"
                  - strong [ref=f28e841]: Ulasan Evaluasi & Rekomendasi Guru
